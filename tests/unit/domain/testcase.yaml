common:
  tags:
    - unit
    - domain
  platform_allow:
    - native_sim
    - qemu_cortex_a9
    - qemu_cortex_a53
    - qemu_riscv64
    - qemu_malta

tests:
  unit.domain: {}
  # A build that decompresses LZ4 image files: the unit lists the method.
  unit.domain.lz4:
    extra_configs:
      - CONFIG_EERIE_LEAP_UI_IMAGE_LZ4=y
