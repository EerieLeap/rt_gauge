# Zephyr maps the RAM image in 4 kB pages, then remaps each megabyte that is
# all code as a 1 MB section, asserting the L1 entry is unused though it holds
# an L2 table. This suite's code fills the megabyte at 0x200000, so the assert
# halts the board before the console exists. The section correctly replaces
# the table, so asserts are off. native_sim still runs the suite with asserts.
CONFIG_ASSERT=n
