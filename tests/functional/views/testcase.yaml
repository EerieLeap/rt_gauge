common:
  tags:
    - functional
    - views
  # Twister ends a run after this many seconds of wall-clock time (60 by default). On qemu_cortex_a9 the
  # suite's ~22 s of emulated time took 59 s on a CI runner, whose 4 vCPUs Twister shares with other builds.
  timeout: 300
  # Rendering suite: only platforms the application supports (see app/boards).
  platform_allow:
    - native_sim
    - qemu_cortex_a9

tests:
  functional.views: {}
  # A build without the built-in fonts: the unit lists none and spends no flash on them.
  functional.views.no_builtin_fonts:
    extra_configs:
      - CONFIG_EERIE_LEAP_UI_BUILTIN_FONTS=n
  # LVGL renders big-endian RGB565, the S3 AMOLED's format.
  functional.views.rgb565_swapped:
    extra_configs:
      - CONFIG_LV_COLOR_FORMAT_RGB565_SWAPPED=y
      # The gauge's blend hook (lvgl_hooks/), which the S3 board turns on.
      - CONFIG_LV_DRAW_SW_ASM_CUSTOM=y
      - CONFIG_LV_DRAW_SW_ASM_CUSTOM_INCLUDE="lvgl_hooks/gauge_draw_sw.h"
      - CONFIG_GAUGE_ROUND_PANEL_CLIP=y
