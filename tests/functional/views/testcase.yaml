common:
  tags:
    - functional
    - views
  # Rendering suite: only platforms the application supports (see app/boards).
  platform_allow:
    - native_sim
    - qemu_cortex_a9

tests:
  functional.views: {}
  # A build without the built-in fonts: the unit lists none and spends no flash on them.
  functional.views.no_builtin_fonts:
    extra_configs:
      - CONFIG_EERIE_LEAP_UI_BUILTIN_FONTS=n
  # LVGL renders big-endian RGB565, the S3 AMOLED's format.
  functional.views.rgb565_swapped:
    extra_configs:
      - CONFIG_LV_COLOR_FORMAT_RGB565_SWAPPED=y
