common:
  tags:
    - functional
    - controllers
  # UiController goes through UiRendererService, which needs a bound display; only
  # native_sim is provisioned for that here.
  platform_allow:
    - native_sim

tests:
  functional.controllers: {}
  # A build without the built-in fonts: the unit lists none and spends no flash on them.
  functional.controllers.no_builtin_fonts:
    extra_configs:
      - CONFIG_EERIE_LEAP_UI_BUILTIN_FONTS=n
