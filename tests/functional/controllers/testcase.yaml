common:
  tags:
    - functional
    - controllers
  # UiController links ~870 KB of demo image data and needs a bound display; only
  # native_sim is provisioned for that here.
  platform_allow:
    - native_sim

tests:
  functional.controllers: {}
  # A release build: no demo screens, so a unit with nothing stored shows nothing until a client stores a UI.
  functional.controllers.no_demo:
    extra_configs:
      - CONFIG_EERIE_LEAP_UI_DEMO_CONFIGURATION=n
