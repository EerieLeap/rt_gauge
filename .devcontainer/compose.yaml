services:
  zephyr-dev:
    build:
      context: ..
      dockerfile: Dockerfile.dev
    environment:
      - DISPLAY=:0
    volumes:
      - /dev:/dev:rw,rslave
      - ..:/home/ubuntu/zephyr/workspace/project:cached
      - ${HOME}/.Xauthority:/home/ubuntu/.Xauthority:ro
    ports:
      - "5900:5900"
    command: sleep infinity
    privileged: true
    pid: host
