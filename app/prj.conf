# Product Info
CONFIG_EERIE_LEAP_PRODUCT_FAMILY_DISPLAY_MODULE=y
# 0xA401
CONFIG_EERIE_LEAP_PRODUCT_ID=41985
CONFIG_EERIE_LEAP_FEATURES_CANBUS=y
CONFIG_EERIE_LEAP_FEATURES_BLUETOOTH=y
CONFIG_EERIE_LEAP_FEATURES_DISPLAY=y
CONFIG_EERIE_LEAP_REVISION=0

# HW Version
CONFIG_EERIE_LEAP_HW_VERSION_MAJOR=11
CONFIG_EERIE_LEAP_HW_VERSION_MINOR=22
CONFIG_EERIE_LEAP_HW_VERSION_PATCH=33

# SW Version
CONFIG_EERIE_LEAP_SW_VERSION_MAJOR=0
CONFIG_EERIE_LEAP_SW_VERSION_MINOR=0
CONFIG_EERIE_LEAP_SW_VERSION_PATCH=1

# Language and Compiler
CONFIG_CPP=y
CONFIG_STD_CPP23=y
CONFIG_REQUIRES_FULL_LIBCPP=y
CONFIG_CPP_EXCEPTIONS=y
CONFIG_CPP_RTTI=y
CONFIG_PICOLIBC=y
CONFIG_CBPRINTF_FP_SUPPORT=y

# Logging And Debugging
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
# CONFIG_LOG_MODE_DEFERRED=y
CONFIG_EARLY_CONSOLE=y
CONFIG_THREAD_ANALYZER=y
CONFIG_THREAD_ANALYZER_USE_LOG=y
CONFIG_THREAD_RUNTIME_STATS=y
CONFIG_THREAD_NAME=y
CONFIG_SYS_HEAP_RUNTIME_STATS=y
CONFIG_THREAD_ANALYZER_ISR_STACK_USAGE=n
CONFIG_EXCEPTION_DEBUG=y
# CONFIG_EXTRA_EXCEPTION_INFO=y
# CONFIG_EXCEPTION_STACK_TRACE=y
# CONFIG_STACK_SENTINEL=y

# System
CONFIG_TIMING_FUNCTIONS=y
CONFIG_NUM_METAIRQ_PRIORITIES=1

# Random Number Generator
CONFIG_ENTROPY_GENERATOR=y
CONFIG_HARDWARE_DEVICE_CS_GENERATOR=y
CONFIG_ENTROPY_DEVICE_RANDOM_GENERATOR=y
# CONFIG_TEST_RANDOM_GENERATOR=y
# CONFIG_TIMER_RANDOM_GENERATOR=y
CONFIG_CRC=y

# Heap Config
CONFIG_SYS_HEAP_ARRAY_SIZE=100
# 80KB
CONFIG_HEAP_MEM_POOL_SIZE=81920
# C++ allocation support
CONFIG_COMMON_LIBC_MALLOC=y
# if not set LIBC malloc will use all available RAM
# 32KB
# CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=32768

# Stack Config
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_THREAD_STACK_INFO=y
CONFIG_DYNAMIC_THREAD=y
CONFIG_DYNAMIC_THREAD_ALLOC=y

# Hardware
CONFIG_GPIO=y

# FS Config
# CONFIG_FS_LITTLEFS_FC_HEAP_SIZE=8192
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_LITTLEFS=y
CONFIG_FILE_SYSTEM_MKFS=y
CONFIG_DISK_ACCESS=y
CONFIG_FS_LITTLEFS_BLK_DEV=y
CONFIG_FS_LITTLEFS_CACHE_SIZE=512

# CBOR
CONFIG_ZCBOR=y

# CANBus
CONFIG_CAN=y
CONFIG_CAN_FD_MODE=y
# CONFIG_CAN_LOG_LEVEL_DBG=y

# LVGL
CONFIG_LVGL=y
# CONFIG_LV_USE_LOG=y
# CONFIG_LV_LOG_LEVEL_ERROR=y
CONFIG_LV_USE_SYSMON=y
CONFIG_LV_USE_ASSERT_MALLOC=y
CONFIG_LV_USE_ASSERT_NULL=y
CONFIG_LV_USE_ASSERT_STYLE=y
CONFIG_LV_USE_LABEL=y
CONFIG_LV_USE_IMAGE=y
# CONFIG_LV_Z_RUN_LVGL_ON_WORKQUEUE=y
CONFIG_LV_Z_FLUSH_THREAD=y
CONFIG_LV_Z_FLUSH_THREAD_PRIORITY=7

# CONFIG_LV_USE_MEM_MONITOR=y
# CONFIG_LV_MEM_MONITOR_ALIGN_CENTER=y
# CONFIG_LV_USE_PERF_MONITOR=y
# CONFIG_LV_PERF_MONITOR_ALIGN_CENTER=y
# CONFIG_LV_PERF_MONITOR_ALIGN_BOTTOM_MID=y

# CONFIG_LV_USE_LOTTIE=y
# CONFIG_LV_USE_THORVG=y
# CONFIG_LV_USE_THORVG_INTERNAL=y
# CONFIG_LV_USE_VECTOR_GRAPHIC=y
# CONFIG_LV_USE_SVG=y
# CONFIG_LV_DRAW_TRANSFORM_USE_MATRIX=y

# Font
CONFIG_LV_USE_FONT_COMPRESSED=y
CONFIG_LV_FONT_MONTSERRAT_20=y
CONFIG_LV_FONT_DEFAULT_UNSCII_16=y

CONFIG_EERIE_LEAP_RT_CORE=y
CONFIG_EERIE_LEAP_CONFIGURATION=y
CONFIG_EERIE_LEAP_ADC=y
CONFIG_EERIE_LEAP_ASSETS=y
CONFIG_EERIE_LEAP_BLUETOOTH=y
CONFIG_EERIE_LEAP_CANBUS=y
CONFIG_EERIE_LEAP_CDMP=y
# CONFIG_EERIE_LEAP_CFB=y
CONFIG_EERIE_LEAP_DEVICE_TREE=y
CONFIG_EERIE_LEAP_EVENT_BUS=y
CONFIG_EERIE_LEAP_FS=y
CONFIG_EERIE_LEAP_GPIO=y
CONFIG_EERIE_LEAP_LUA_SCRIPT=y
CONFIG_EERIE_LEAP_MATH_PARSER=y
CONFIG_EERIE_LEAP_MDF=y
CONFIG_EERIE_LEAP_RANDOM=y
CONFIG_EERIE_LEAP_THREADING=y
CONFIG_EERIE_LEAP_TIME=y

CONFIG_EERIE_LEAP_DOMAIN_BLE=y
CONFIG_EERIE_LEAP_DOMAIN_CANBUS=y
CONFIG_EERIE_LEAP_DOMAIN_CANBUS_COM=y
CONFIG_EERIE_LEAP_DOMAIN_CANBUS_COM_DEVICE_TYPE_DISPLAY=y
CONFIG_EERIE_LEAP_DOMAIN_SCRIPT=y
CONFIG_EERIE_LEAP_DOMAIN_SENSOR=y
CONFIG_EERIE_LEAP_DOMAIN_SYSTEM=y

CONFIG_EERIE_LEAP_CDMP_SERVICE_THREAD_PRIORITY=6
CONFIG_EERIE_LEAP_CDMP_WORK_QUEUE_PRIORITY=6

CONFIG_EERIE_LEAP_DOMAIN_SENSOR_PROCESSING_SERVICE_STACK_SIZE=4096
CONFIG_EERIE_LEAP_DOMAIN_SENSOR_PROCESSING_SERVICE_PRIORITY=6
