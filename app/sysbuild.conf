# Sysbuild configuration of the gauge: MCUboot in front of every hardware build, two image slots.
# Hardware builds always use --sysbuild (README.md). Plan: dev_docs/plans/todo/FIRMWARE_UPDATE_PLAN.md.

SB_CONFIG_BOOTLOADER_MCUBOOT=y

# Swap using move (D1): an update goes to slot1, MCUboot swaps the slots on the next reset, and the
# previous image stays in slot1 as the backup, which also allows a manual rollback. Sysbuild's own
# default is swap using offset.
SB_CONFIG_MCUBOOT_MODE_SWAP_USING_MOVE=y

# ECDSA P-256 with TinyCrypt (D4), small enough for the boot partitions. The S3 board's own
# Kconfig.sysbuild defaults to no signature, which this line overrides.
SB_CONFIG_BOOT_SIGNATURE_TYPE_ECDSA_P256=y

# The development key, committed in rt_core: it protects nothing, but a unit that trusts it takes
# images from this project only, never MCUboot's public sample keys. Release builds replace it
# ('-DSB_CONFIG_BOOT_SIGNATURE_KEY_FILE="<absolute path>"' with the quotes, .github/workflows/release.yml).
# The ${APP_DIR} is expanded by sysbuild (string(CONFIGURE) on the image settings) before it reaches
# MCUboot and the application, so the same absolute path serves both from any build directory.
SB_CONFIG_BOOT_SIGNATURE_KEY_FILE="${APP_DIR}/../modules/eerie_leap_rt_core/keys/dev-ec-p256.pem"
