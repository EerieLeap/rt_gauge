# Kconfig fragment of MCUboot, appended to MCUboot's own configuration by sysbuild (hardware builds,
# see ../sysbuild.cmake and ../sysbuild.conf). It applies to both gauge boards.
#
# MCUboot is built from the board's devicetree and defconfig, so every driver whose node the board
# enables, and everything the board defconfig turns on for the application, lands in MCUboot too. It
# has to fit 64 KB (S3, boot_partition at 0x0) or 56 KB (P4, at 0x2000), and it is built without
# threads, so drivers that need a work queue do not link at all. MCUboot loads the application from
# flash and jumps to it; it needs the flash, the log (off) and the crypto, nothing else.
#
# scripts/check_image_sizes.py fails the build when MCUboot outgrows its partition.
#
# Passing -Dmcuboot_EXTRA_CONF_FILE=... replaces this file; list it first to keep these settings.

# Kconfig prints a (harmless) warning that MSPI_DMA_MAX_BUFFER_SIZE, set by the S3 board's defconfig, is
# unavailable without MSPI. The projects' display and MSPI driver libraries have no sources in MCUboot, so
# CMake says "No SOURCES given to Zephyr library" for them and leaves them out.
#
# Display, touch and their buses (S3: CO5300 over MSPI, CST92xx over I2C; P4: DSI panel, GT911).
CONFIG_DISPLAY=n
CONFIG_ELCO5300=n
CONFIG_MSPI=n
CONFIG_MSPI_ESP32=n
CONFIG_MSPI_DMA=n
CONFIG_DMA=n
CONFIG_INPUT=n
CONFIG_INPUT_CST92XX=n
CONFIG_INPUT_GPIO_KEYS=n
CONFIG_I2C=n
CONFIG_GPIO_PCA_SERIES=n

# Board power rails and the panel backlight.
CONFIG_REGULATOR=n
CONFIG_PWM=n

# Bench block: MCUboot's log on the console, to watch the swap and the revert of an update (a line per
# step; the panel stays dark meanwhile). Uncomment, build, and flash MCUboot once. The log grows MCUboot,
# so check scripts/check_image_sizes.py still passes (the P4 has the least room).
#
# On the S3 the console of MCUboot is the board's uart0 (GPIO pins); only the application's overlay moves
# its console to the USB-Serial-JTAG, so for the log on /dev/ttyACM0 give MCUboot an overlay as well, next
# to the partition table that app/sysbuild.cmake adds:
#
#   -Dmcuboot_EXTRA_DTC_OVERLAY_FILE=/path/to/mcuboot_usb.overlay
#
#   / { chosen { zephyr,console = &usb_serial; }; };
#   &usb_serial { status = "okay"; };
#
# The P4 logs on its USB-UART port (uart0), as the application does.
#
# CONFIG_SERIAL=y
# CONFIG_CONSOLE=y
# CONFIG_UART_CONSOLE=y
# CONFIG_MCUBOOT_LOG_LEVEL_INF=y
# CONFIG_MCUBOOT_BOOT_BANNER=y
