# Bench fragment: the Zephyr shell on the console with SMP over it, and a periodic report of every
# thread's stack peak. A development aid for the logging control bench (tools/smp_can_client.py
# --serial drives it), not for a shipped build.
#
#   west build -d build_bench -b esp32s3_touch_amoled_1_75/esp32s3/procpu --sysbuild ./app -- -DEXTRA_CONF_FILE=bench.conf
#
# Under sysbuild the unprefixed EXTRA_CONF_FILE reaches the app image only, not MCUboot.
#
# Build it in a directory of its own: the fragment stays in the CMake cache until a pristine build.
#
# The thread analyzer lines do nothing on native_sim (the analyzer needs a real architecture).

# The shell on the console: the transport for SMP, and for shell commands.
CONFIG_SHELL=y
CONFIG_SHELL_STACK_SIZE=4096
# Logs keep the shipped path, so the bench measures the shipped stacks and timing: the UART log
# backend writes with uart_poll_out and takes no lock, where the shell log backend would serialize
# every thread that logs on the shell's mutex and run deeper on each caller's stack. The client
# skips the log text that lands between SMP lines.
CONFIG_SHELL_LOG_BACKEND=n
CONFIG_LOG_BACKEND_UART=y
# The shell implies runtime filtering, which starts every log source at LOG_RUNTIME_DEFAULT_LEVEL (INF)
# and drops the debug output a shipped build prints; without LOG_CMDS nothing raises it again.
CONFIG_LOG_RUNTIME_FILTERING=n
# Shell output goes out with uart_poll_out too. Interrupt-driven transmit waits for a host to drain
# the USB-Serial-JTAG FIFO and would block the shell thread, and with it every thread that prints
# through the shell, whenever no host has the port open. Polled output gives up on a missing host.
CONFIG_SHELL_BACKEND_SERIAL_FORCE_TX_BLOCKING_MODE=y
# Receive stays interrupt-driven: the polling API never hands SMP frames to MCUmgr. It is already
# the default on the S3; native_sim's pty needs it asked for.
CONFIG_SHELL_BACKEND_SERIAL_INTERRUPT_DRIVEN=y
CONFIG_BASE64=y
CONFIG_MCUMGR_TRANSPORT_SHELL=y
# A whole config-group request (at most 12 lines of 127 bytes) waits here while the shell thread, at
# the lowest priority, is not scheduled; the default 2 lose lines.
CONFIG_MCUMGR_TRANSPORT_SHELL_RX_BUF_COUNT=16
# A request cut off mid-frame does not keep the shell input in SMP mode.
CONFIG_MCUMGR_TRANSPORT_SHELL_INPUT_TIMEOUT=y

# Every thread's stack peak, logged every 10 s through the UART backend.
CONFIG_THREAD_ANALYZER=y
CONFIG_THREAD_ANALYZER_USE_LOG=y
CONFIG_THREAD_ANALYZER_AUTO=y
CONFIG_THREAD_ANALYZER_AUTO_INTERVAL=10
# Margin over Zephyr's 2048 for this combination (immediate logging at -O0): the report prints
# percentages of every thread.
CONFIG_THREAD_ANALYZER_AUTO_STACK_SIZE=3072
CONFIG_THREAD_ANALYZER_PRINT_THREAD_PRIORITY=y
# The S3 has no stack guard. A sentinel word at the bottom of every stack, checked at each context
# switch, stops the unit with the thread's name when a stack overflows instead of corrupting its
# neighbour, so a peak at the limit shows up as a fault.
CONFIG_STACK_SENTINEL=y
