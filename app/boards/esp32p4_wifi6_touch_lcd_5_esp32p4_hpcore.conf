# Memory
# ==============================================

# 32 MB in-package PSRAM on the ESP32-P4NRW32. The board Kconfig.defconfig
# already sizes the SPIRAM heap for the two 1.76 MB DSI framebuffers.
CONFIG_ESP_SPIRAM=y

# Display
# ==============================================

CONFIG_DISPLAY=y
# CONFIG_DISPLAY_LOG_LEVEL_DBG=y

CONFIG_INPUT=y
CONFIG_INPUT_QUEUE_MAX_MSGS=40
CONFIG_INPUT_GT911_MAX_TOUCH_POINTS=1

# LVGL
# ==============================================

CONFIG_LV_DEF_REFR_PERIOD=20
CONFIG_LV_Z_FLUSH_THREAD_STACK_SIZE=2048

# The HX8394 is driven in RGB565.
CONFIG_LV_COLOR_DEPTH_16=y
CONFIG_LV_Z_BITS_PER_PIXEL=16

# The panel scans out portrait and cannot rotate: a video mode panel has no
# frame memory to transpose. UiRendererService rotates each area in its own
# flush callback instead, which replaces the one the flush thread signals.
CONFIG_EERIE_LEAP_UI_ROTATION_270=y
CONFIG_LV_Z_FLUSH_THREAD=n

# 720x1280x2 is 1.76 MB, so a full-size VDB would cost more than the
# framebuffers it feeds.
# CONFIG_LV_Z_VDB_SIZE=100
CONFIG_LV_Z_DOUBLE_VDB=y
CONFIG_LV_Z_FULL_REFRESH=y

# Internal SRAM is only 384 KB; the rendering buffers and the LVGL pool are
# linked into PSRAM through the .lvgl_buf / .lvgl_heap sections.
CONFIG_LV_Z_VDB_CUSTOM_SECTION=y
CONFIG_LV_Z_MEMORY_POOL_CUSTOM_SECTION=y
# LVGL Transform requires a lot of memory
CONFIG_LV_Z_MEM_POOL_SIZE=65536

# Matches the L2 line, so a tile row of the transpose is one line.
CONFIG_LV_Z_VDB_ALIGN=64

# The rotation in UiRendererService drives the accelerator directly. It reaches
# the buffers over 2D-DMA, so their alignment has to equal the L2 line size.
# CONFIG_ESP32_PPA=y
CONFIG_LV_DRAW_BUF_ALIGN=64

# Offload LVGL fills and image blits to the PPA as well. Needs the
# lvgl_ppa_cache_invalidate patch: without it the draw units leave the lines
# they wrote over 2D-DMA stale in the cache, and the renderer writes the stale
# halves back over them.
CONFIG_LV_USE_PPA=y
CONFIG_LV_USE_PPA_IMG=y

# CANBus
# ==============================================

# No CAN transceiver is fitted on this board, so no can0 alias is defined and
# the CANBus controller starts without a bus.

# Bluetooth
# ==============================================

# HCI is reached over the on-board ESP32-C6, which must be running matching
# esp-hosted-mcu coprocessor firmware.
CONFIG_BT=y
CONFIG_BT_DIS=y

# The C6 ships Waveshare's ESP-IDF esp-hosted slave firmware rather than
# esp-hosted-mcu, so every RPC goes unanswered. The first is made from
# POST_KERNEL init and two more from the HCI open, so the default 5 s costs
# about 15 s of boot before the UI appears. Raise it once the C6 is reflashed.
CONFIG_ESP_HOSTED_MCU_RPC_TIMEOUT_MS=500
CONFIG_BT_ATT_PREPARE_COUNT=1
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="EerieLeap"
CONFIG_BT_DEVICE_APPEARANCE=833

CONFIG_BT_SMP=y
CONFIG_BT_PRIVACY=y
CONFIG_BT_KEYS_OVERWRITE_OLDEST=y
CONFIG_BT_TX_PROCESSOR_STACK_SIZE=2048
# "BT RX WQ" thread
CONFIG_BT_RX_STACK_SIZE=8192
# "BT LW WQ" thread
CONFIG_BT_LONG_WQ_STACK_SIZE=2048

# SMP configuration for Just Works
CONFIG_BT_SMP_SC_ONLY=n
CONFIG_BT_SMP_ALLOW_UNAUTH_OVERWRITE=y

# BT Settings
CONFIG_BT_SETTINGS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y

CONFIG_BT_GATT_SERVICE_CHANGED=y

CONFIG_BT_MAX_CONN=1
CONFIG_BT_MAX_PAIRED=1

CONFIG_BT_BUF_ACL_TX_COUNT=12
CONFIG_BT_BUF_EVT_RX_COUNT=16
CONFIG_BT_L2CAP_TX_BUF_COUNT=12

# Too low value can lead to BT ATT PDU buffer pool exhaustion
# Uses RAM, works fine with val=20, set to 30 to be on safer side
# Size of a single buffer ~350 bytes
CONFIG_BT_ATT_TX_COUNT=30

# Data Length Update
CONFIG_BT_USER_DATA_LEN_UPDATE=y
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_L2CAP_TX_MTU=247
