CONFIG_FLASH_SIMULATOR=y
CONFIG_DISPLAY=y

# Bundled images are built into the external heap at static init
CONFIG_SYS_HEAP_AUTO=y
CONFIG_HEAP_MEM_POOL_SIZE=4194304
CONFIG_LV_Z_MEM_POOL_SIZE=1048576
# MMU targets default to a 16 KB malloc arena
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=8388608
# The default 8 MB virtual space cannot hold the image plus device mappings
CONFIG_KERNEL_VM_SIZE=0x2000000

# QEMU has no entropy source
CONFIG_TEST_RANDOM_GENERATOR=y
CONFIG_TIMER_RANDOM_GENERATOR=y
CONFIG_TEST_CSPRNG_GENERATOR=y

# The app always links BLE; uart1 carries H4 HCI with no controller attached
CONFIG_BT=y
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="EerieLeap"
CONFIG_BT_SMP=y
CONFIG_BT_USER_DATA_LEN_UPDATE=y
CONFIG_UART_INTERRUPT_DRIVEN=y
# Let bt_enable() fail after the HCI timeout instead of asserting
CONFIG_BT_ASSERT=n
