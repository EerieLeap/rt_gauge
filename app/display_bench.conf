# Display bench fragment: the ui_bench shell command (refresh, flush and driver counters, full-screen
# invalidation, LVGL's built-in profiler) and LVGL's performance monitor printing to the log. Built
# together with bench.conf, which provides the shell; for the display performance plan (Phase 0).
#
#   west build -d build_display_bench_a -p auto -b esp32s3_touch_amoled_1_75/esp32s3/procpu --sysbuild ./app -o=-j4 -- -DEXTRA_CONF_FILE="bench.conf;display_bench.conf"
#
# Never shipped: the performance monitor keeps LVGL's refresh timer running, so the renderer never
# sleeps for long, and the probes add work to every flush. Build it in a directory of its own.

CONFIG_EERIE_LEAP_UI_BENCH=y
CONFIG_MSPI_ESP32_STATS=y
CONFIG_ELCO5300_STATS=y

# Thread and CPU usage for k_thread_runtime_stats_get() and _all_get().
CONFIG_THREAD_RUNTIME_STATS=y
CONFIG_SCHED_THREAD_USAGE=y
CONFIG_SCHED_THREAD_USAGE_ALL=y

# LVGL's system monitor in log mode: one "sysmon:" line per period (fixed at 300 ms by
# LV_SYSMON_REFR_PERIOD_DEF, no Kconfig). The log level USER lets LV_LOG() lines through without the
# trace and info output; it drops LVGL's own warnings and errors.
CONFIG_LV_USE_LOG=y
CONFIG_LV_LOG_LEVEL_USER=y
CONFIG_LV_USE_SYSMON=y
CONFIG_LV_USE_PERF_MONITOR=y
CONFIG_LV_USE_PERF_MONITOR_LOG_MODE=y

# LVGL's built-in profiler, off until `ui_bench trace on`. The buffer comes out of LVGL's heap.
CONFIG_LV_USE_PROFILER_BUILTIN=y
CONFIG_LV_PROFILER_BUILTIN_DEFAULT_ENABLE=n
CONFIG_LV_PROFILER_BUILTIN_BUF_SIZE=65536
# Zephyr puts LVGL's src/ on the include path, not the include/ that holds the "lvgl/..." default, and
# src/debugging/profiler/ has no public header; reach the real one relative to src/.
CONFIG_LV_PROFILER_INCLUDE="../include/lvgl/debugging/profiler/lv_profiler_builtin.h"

# The shell must run promptly under full load (the renderer is at 8), so a measurement window is timed
# on the unit and its output is not interleaved by the renderer's log lines. 6 is above it and still
# preemptible.
CONFIG_SHELL_THREAD_PRIORITY_OVERRIDE=y
CONFIG_SHELL_THREAD_PRIORITY=6

# The frame path and these probes push the image's text and rodata past a 64 KB page, which moves external RAM
# up by 64 KB and leaves the image 16,720 B over the 8 MB of PSRAM. The SPIRAM heap gives that page up (the board
# conf's 2359296 minus 65536); the production image keeps its margin and its heap.
CONFIG_ESP_SPIRAM_HEAP_SIZE=2293760
