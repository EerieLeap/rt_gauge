description: CO5300 QSPI Display Controller

compatible: "chipone,elco5300"

include: [mspi-device.yaml, display-controller.yaml, lcd-controller.yaml, pinctrl-device.yaml]

properties:
  te-gpios:
    type: phandle-array
    description: |
      Tearing effect GPIO pin.

  reset-gpios:
    type: phandle-array
    description: |
      Reset GPIO pin. Set high to reset the display

  orientation:
    type: string
    default: "normal"
    enum:
      - "normal"
      - "90"
      - "180"
      - "270"
    description: Display orientation (CW) in degrees. Only "normal" and "180" are supported by the driver. At 180 the x-offset and y-offset are applied unchanged; a panel mirrored over 480 columns (466 wide) may need another x-offset there (unverified).

  x-offset:
    type: int
    default: 0
    description: The column offset in pixels of the display

  y-offset:
    type: int
    default: 0
    description: The row offset in pixels of the display
