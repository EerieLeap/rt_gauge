description: Espressif ESP32 MSPI controller

compatible: "espressif,esp32-mspi"

include: [mspi-controller.yaml, pinctrl-device.yaml, reset-device.yaml]

properties:
  reg:
    required: true
    description: Base address and size of the SPI peripheral registers

  peripheral-id:
    type: int
    required: true
    description: |
      0-based SPI peripheral index as seen by the driver:
        0 → SPI2 (HSPI/FSPI), HAL host_id = 1
        1 → SPI3 (VSPI),      HAL host_id = 2
      SPI0 and SPI1 are reserved for flash cache.

  clocks:
    required: true
    description: Clock controller phandle and clock specifier

  clock-frequency:
    type: int
    default: 80000000
    description: |
      Maximum controller clock in Hz. Default is 80 MHz.
      The SPI makes its clock from the 80 MHz source divided by an integer
      of 2 or more, so on the ESP32-S3 SPI2 and SPI3 can run at 80 MHz (any
      request above 60 MHz), 40, 26.67, 20, 16, 13.33, 11.43, 10 MHz and so
      on down. The driver picks the nearest one to a device's requested
      frequency and logs the effective clock at LOG_INF when it changes.
      A request between two of them gets the nearest (30 MHz runs at
      26.67 MHz): ask for an exact quotient.

  interrupts:
    description: Interrupt specifier for the SPI peripheral

  dma-enabled:
    type: boolean
    description: Enable DMA support for data transfers.

  dma-host:
    type: int
    description: |
      DMA host / peripheral slot index (0-based):
        0 → SPI2, 1 → SPI3.
      On GDMA targets this selects the GDMA trigger-peripheral slot.
      On legacy ESP32/ESP32-S2 it maps to the DPORT_SPI_DMA_CHAN_SEL field.

  # -----------------------------------------------------------------------
  # Legacy integrated-DMA path (ESP32, ESP32-S2 only)
  # Ignored at compile time on GDMA targets via #ifdef SOC_GDMA_SUPPORTED.
  # -----------------------------------------------------------------------
  dma-clk:
    type: int
    description: |
      Clock module ID for the legacy integrated SPI-DMA engine.
      Only for ESP32 / ESP32-S2.  Do not set on GDMA-capable SoCs.

  line-idle-low:
    type: boolean
    description: |
      Drive data lines low when idle.  Default (absent) is high, which
      is correct for SPI modes 0 and 3.

  use-iomux:
    type: boolean
    description: |
      Route signals through IO_MUX instead of the GPIO matrix.
      Required for frequencies above ~20 MHz.  Only valid for the
      dedicated IO_MUX pins of the selected peripheral; see TRM.

      Has no effect on the ESP32-S3 in this driver: the signal routing is
      chosen by the pinctrl state, and this flag only tells
      spi_hal_cal_clock_conf() whether to add the GPIO matrix delay to its
      estimate of the extra dummy cycles a read needs. Writes are not
      affected.

  transfer-timeout:
    type: int
    default: 100
    description: |
      Default transfer timeout in milliseconds used when the caller
      does not supply a per-transfer timeout.

  duty-cycle:
    type: int
    default: 128
    description: |
      SPI clock duty-cycle hint (0–255, 128 ≈ 50 %).
      Passed to spi_hal_cal_clock_conf().
